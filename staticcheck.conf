# staticcheck's default checks, plus all style checks except these:
# ST1005 flags error strings that start with a capital letter. cav's errors often start with
# a product name (Cavalry, Freesound, Unsplash), which keeps its capital.
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
