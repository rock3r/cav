name: Codex plugin zip
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the zip to, such as v1.3.0'
        required: true
permissions:
  contents: write
jobs:
  attach:
    name: Attach the Codex plugin zip
    runs-on: ubuntu-latest
    steps:
      # Run the script from the default branch, so tags made before it existed can be zipped.
      # The script archives only the tag's committed plugin folder.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Zip the plugin and upload it to the release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          zip="$(tools/package-codex-plugin.sh "$TAG")"
          gh release upload "$TAG" "$zip" --clobber
