name: Fixture checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck (configured in staticcheck.conf)
        run: go tool staticcheck ./...
      - name: govulncheck
        run: go tool govulncheck ./...
  windows:
    name: Build and tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/cav
      - name: go vet
        run: go vet ./...
      - name: Go tests
        # Most cmd/cav tests stub ffmpeg, Cavalry's bridge and pipes with POSIX shell scripts,
        # and packaging/ drives the POSIX release scripts: those run on Linux and macOS.
        # Bash stops at the first failing command. PowerShell, the Windows default, reported
        # only the last command's exit code, which hid failures in ./internal/...
        shell: bash
        run: |
          go test ./internal/...
          go test ./cmd/cav -run 'TestReviewHook'

  fixtures:
    name: Fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Tracers for the vector tests
        # internal/imagegen traces a real image with potrace (ffmpeg makes the bitmap).
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y potrace ffmpeg
      - name: Go race tests and static checks
        env:
          # Where the tracers are installed, their test must not skip.
          CAV_REQUIRE_TRACERS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: |
          go test -race ./...
          go vet ./...
      - name: Native JavaScript fixtures
        run: node --test assets/helpers/test/*.test.js assets/diagnostics/test/*.test.js assets/bridge/test/*.test.js assets/board/test/*.test.js
      - uses: astral-sh/setup-uv@v6
        if: matrix.os == 'ubuntu-latest'
      - name: Python helpers (music renderer, background removal)
        # The plugin tests need a VST3 instrument (CAV_TEST_VST3), so they skip here.
        if: matrix.os == 'ubuntu-latest'
        run: >-
          uv run --no-project --python 3.12 --with numpy --with pedalboard --with pyloudnorm
          --with mido --with matchering --with pillow python -m unittest discover -s assets/python/test
      - name: YuE2 server (Python, fake pipeline)
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-project --python 3.12 python -m unittest discover -s tools/yue2-server
      - name: Development archives for all five targets
        # No Apple credentials, live bridge access, release tags or publication.
        run: |
          version="$(node -p "require('./plugins/cavalry/plugin.json').version")"
          tools/release.sh "v$version" --dev
